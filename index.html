<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEAE0;
    --ink:#241F1B;
    --ink-soft:#6B6459;
    --line:#D8D2C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Serif TC', serif;
  }
  .mono{ font-family:'Space Mono', monospace; letter-spacing:0.02em; }

  .app{
    display:grid;
    grid-template-columns: 360px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; }
  }

  /* ---------- left panel ---------- */
  .panel{
    border-right:1px solid var(--line);
    padding:32px 28px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  @media (max-width: 860px){
    .panel{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); }
  }
  .title{ font-size:22px; font-weight:700; margin:0 0 4px; }
  .subtitle{ font-size:13px; color:var(--ink-soft); margin:0 0 28px; line-height:1.6; }

  .dropzone{
    border:1px dashed var(--ink-soft);
    border-radius:2px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone:hover{ border-color:var(--ink); background:var(--paper-2); }
  .dropzone.drag{ border-color:var(--ink); background:var(--paper-2); }
  .dropzone p{ margin:0; font-size:13px; color:var(--ink-soft); }
  .dropzone .cta{ font-size:14px; color:var(--ink); margin-bottom:6px; }
  input[type=file]{ display:none; }

  .section-label{ font-size:12px; color:var(--ink-soft); margin:24px 0 10px; }

  /* palette: 2 small columns x 3 rows, filled column-first */
  .palette-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px 12px;
  }
  .swatch{
    width:100%;
    aspect-ratio:1;
    border-radius:2px;
    border:1px solid rgba(0,0,0,.08);
    position:relative;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .swatch:hover{ transform:translateY(-2px); }
  .swatch.active{ outline:2px solid var(--ink); outline-offset:2px; }
  .swatch .check{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; opacity:0;
  }
  .swatch.active .check{ opacity:1; }
  .swatch .hex{
    position:absolute; bottom:-16px; left:0; right:0;
    text-align:center; font-size:8px; color:var(--ink-soft);
  }

  /* crop / reposition controls */
  .crop-wrap{ display:none; }
  .crop-canvas{
    width:100%;
    aspect-ratio:1;
    border-radius:2px;
    border:1px solid var(--line);
    touch-action:none;
    cursor:grab;
    display:block;
  }
  .crop-canvas:active{ cursor:grabbing; }
  .zoom-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .zoom-row input[type=range]{ flex:1; }
  .apply-btn{
    margin-top:12px;
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:10px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .apply-btn:hover{ opacity:.85; }
  .field-hint{ font-size:11px; color:var(--ink-soft); margin:6px 0 0; }

  .status{ font-size:12px; color:var(--ink-soft); margin-top:14px; min-height:16px; }

  /* ---------- right gallery ---------- */
  .gallery{ padding:32px; }
  .gallery-empty{
    height:70vh; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:14px; text-align:center; line-height:1.8;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:28px; }
  .card-slot{ display:flex; flex-direction:column; align-items:stretch; }
  .card-slot img{
    width:100%; height:auto; border-radius:2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.08);
    display:block;
  }
  .card-meta{ display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; }
  .card-name{ font-size:13px; font-weight:600; }
  .card-index{ font-size:11px; color:var(--ink-soft); }

  .card-fields{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field-row{ display:flex; flex-direction:column; gap:3px; }
  .field-label{ font-size:10px; color:var(--ink-soft); font-family:'Space Mono', monospace; }
  .field-input{
    font-family:'Noto Serif TC', serif;
    font-size:12px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:2px;
    background:#fff;
    color:var(--ink);
  }
  .field-input:focus{ outline:none; border-color:var(--ink-soft); }

  .update-btn{
    margin-top:10px;
    align-self:flex-start;
    background:var(--paper-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:11px;
    padding:6px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .update-btn:hover{ border-color:var(--ink); }

  .download-btn{
    margin-top:8px;
    align-self:flex-start;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:11px;
    padding:6px 14px;
    border-radius:2px;
    cursor:pointer;
    display:inline-block;
    text-decoration:none;
  }
  .download-btn:hover{ border-color:var(--ink); }
</style>
</head>
<body>

<div class="app">
  <div class="panel">
    <p class="title">Memory Palette</p>
    <p class="subtitle">上傳一張照片，自動萃取主要色彩，生成一組風格各異的實體感卡片。</p>

    <div class="dropzone" id="dropzone">
      <p class="cta">點擊或拖曳照片到這裡</p>
      <p>支援 JPG／PNG</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="previewWrap" style="display:none;">
      <img id="previewImg" alt="上傳的照片預覽" style="width:100%; border-radius:2px; border:1px solid var(--line); display:block; margin-top:16px;">
      <span id="changeLink" style="display:inline-block; margin-top:10px; font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px;">更換照片</span>
    </div>

    <div id="paletteSection" style="display:none;">
      <p class="section-label">主要色彩 · 點選來指定卡片主色</p>
      <div class="palette-row" id="paletteRow"></div>
    </div>

    <div class="crop-wrap" id="cropWrap">
      <p class="section-label">調整照片位置／縮放 · 拖曳移動，滑桿縮放</p>
      <canvas class="crop-canvas" id="cropCanvas" width="260" height="260"></canvas>
      <div class="zoom-row">
        <span class="mono" style="font-size:11px; color:var(--ink-soft);">縮放</span>
        <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1">
      </div>
      <button class="apply-btn" id="applyCropBtn">套用調整（更新全部卡片）</button>
      <p class="field-hint">套用之後才會反映到右側所有卡片；已編輯的文字不會被重置</p>
    </div>

    <p class="status" id="status"></p>
    <p class="field-hint" id="gpsHint"></p>

    <p class="section-label">卡片字體設定 · 套用到全部卡片</p>
    <select id="fontStyleSelect" class="field-input" style="width:100%;">
      <option value="serif">襯線體（預設）</option>
      <option value="sans">黑體</option>
    </select>
    <div class="zoom-row">
      <span class="mono" style="font-size:11px; color:var(--ink-soft);">字級</span>
      <input type="range" id="fontScaleSlider" min="0.8" max="1.3" step="0.05" value="1">
    </div>
  </div>

  <div class="gallery">
    <div class="gallery-empty" id="galleryEmpty">上傳照片後，這裡會出現<br>色塊卡、音樂卡、票根、底片等卡片</div>
    <div class="grid" id="grid" style="display:none;"></div>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const changeLink = document.getElementById('changeLink');
const paletteSection = document.getElementById('paletteSection');
const paletteRow = document.getElementById('paletteRow');
const statusEl = document.getElementById('status');
const gpsHint = document.getElementById('gpsHint');
const galleryEmpty = document.getElementById('galleryEmpty');
const grid = document.getElementById('grid');
const cropWrap = document.getElementById('cropWrap');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d');
const zoomSlider = document.getElementById('zoomSlider');
const applyCropBtn = document.getElementById('applyCropBtn');

let currentImage = null;
let currentPalette = [];
let selectedColorIndex = 0;
let shotDate = new Date();
let gpsCoords = null;
let resolvedPlaceName = '';

let cropCenterX = 0, cropCenterY = 0, cropZoom = 1;
let dragging = false, lastX = 0, lastY = 0;
let fontScale = 1;
let serifFont = "'Noto Serif TC'";
let monoFont = "'Space Mono', monospace";

const fieldState = {};   // idx -> { key: value }
const fieldTouched = new Set(); // "idx:key"
const cardInputs = {};   // idx -> { key: inputEl }
const cardImgEls = {};   // idx -> img element
const cardLinkEls = {};  // idx -> a element

dropzone.addEventListener('click', () => fileInput.click());
changeLink.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  statusEl.textContent = '讀取照片中…';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      previewImg.src = ev.target.result;
      previewWrap.style.display = 'block';

      shotDate = new Date(file.lastModified || Date.now());
      gpsCoords = null;
      resolvedPlaceName = '';
      selectedColorIndex = 0;
      gpsHint.textContent = '';
      for (const k in fieldState) delete fieldState[k];
      fieldTouched.clear();

      cropCenterX = img.width / 2;
      cropCenterY = img.height / 2;
      cropZoom = 1;
      zoomSlider.value = 1;
      cropWrap.style.display = 'block';
      drawCropPreview();

      readExif(img);
      statusEl.textContent = '萃取色彩中…';
      setTimeout(() => {
        currentPalette = extractPalette(img, 6);
        renderPalette(currentPalette);
        statusEl.textContent = '生成卡片中…';
        setTimeout(() => {
          renderAllCards();
          statusEl.textContent = '完成，共 ' + CARD_DEFS.length + ' 種卡片';
        }, 30);
      }, 30);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- crop / reposition ---------------- */
function drawCropPreview() {
  if (!currentImage) return;
  cropCtx.clearRect(0, 0, 260, 260);
  drawCover(cropCtx, currentImage, 0, 0, 260, 260);
}
function clampCropCenter() {
  if (!currentImage) return;
  const P = 260;
  const iw = currentImage.width, ih = currentImage.height;
  const baseScale = Math.max(P / iw, P / ih);
  const effScale = baseScale * cropZoom;
  const sw = Math.min(P / effScale, iw);
  const sh = Math.min(P / effScale, ih);
  const minX = sw / 2, maxX = iw - sw / 2;
  const minY = sh / 2, maxY = ih - sh / 2;
  cropCenterX = Math.min(Math.max(cropCenterX, Math.min(minX, maxX)), Math.max(minX, maxX));
  cropCenterY = Math.min(Math.max(cropCenterY, Math.min(minY, maxY)), Math.max(minY, maxY));
}
cropCanvas.addEventListener('pointerdown', e => {
  if (!currentImage) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cropCanvas.setPointerCapture(e.pointerId);
});
cropCanvas.addEventListener('pointermove', e => {
  if (!dragging || !currentImage) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const iw = currentImage.width, ih = currentImage.height;
  const baseScale = Math.max(260 / iw, 260 / ih);
  const effScale = baseScale * cropZoom;
  cropCenterX -= dx / effScale;
  cropCenterY -= dy / effScale;
  clampCropCenter();
  drawCropPreview();
});
window.addEventListener('pointerup', () => { dragging = false; });
zoomSlider.addEventListener('input', e => {
  cropZoom = parseFloat(e.target.value);
  clampCropCenter();
  drawCropPreview();
});
applyCropBtn.addEventListener('click', () => {
  if (!currentImage) return;
  refreshAllCardImages();
});
document.getElementById('fontStyleSelect').addEventListener('change', e => {
  serifFont = e.target.value === 'sans' ? "'Noto Sans TC'" : "'Noto Serif TC'";
  if (currentImage) refreshAllCardImages();
});
document.getElementById('fontScaleSlider').addEventListener('input', e => {
  fontScale = parseFloat(e.target.value);
  if (currentImage) refreshAllCardImages();
});

/* ---------------- exif + reverse geocoding ---------------- */
function toDecimal(dms, ref) {
  if (!dms || dms.length < 3) return null;
  let val = dms[0] + dms[1] / 60 + dms[2] / 3600;
  if (ref === 'S' || ref === 'W') val = -val;
  return val;
}
function readExif(img) {
  if (typeof EXIF === 'undefined') return;
  try {
    EXIF.getData(img, function () {
      const lat = EXIF.getTag(this, 'GPSLatitude');
      const latRef = EXIF.getTag(this, 'GPSLatitudeRef');
      const lon = EXIF.getTag(this, 'GPSLongitude');
      const lonRef = EXIF.getTag(this, 'GPSLongitudeRef');
      const dto = EXIF.getTag(this, 'DateTimeOriginal');

      if (lat && lon) {
        const latD = toDecimal(lat, latRef);
        const lonD = toDecimal(lon, lonRef);
        if (latD !== null && lonD !== null) {
          gpsCoords = { lat: latD, lon: lonD };
          gpsHint.textContent = '已讀到 GPS 座標，查詢地點名稱中…';
          reverseGeocode(latD, lonD);
        }
      } else {
        gpsHint.textContent = '這張照片沒有 GPS 資訊，地點需手動輸入';
      }
      if (dto) {
        const parts = dto.split(' ');
        const d = parts[0].split(':');
        const t = (parts[1] || '00:00:00').split(':');
        shotDate = new Date(+d[0], +d[1] - 1, +d[2], +t[0], +t[1], +t[2]);
        if (currentImage && cardImgEls[0] !== undefined) refreshAllCardImages();
      }
    });
  } catch (e) { /* no exif, keep defaults */ }
}
function locationCardIndex() { return CARD_DEFS.findIndex(d => d.name === '旅拍地標卡'); }
function reverseGeocode(lat, lon) {
  const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`;
  fetch(url).then(r => r.json()).then(data => {
    const name = data.city || data.locality || data.principalSubdivision || '';
    const country = data.countryName || '';
    const label = name && country ? `${name} · ${country}` : (name || country || '');
    if (!label) { gpsHint.textContent = '有 GPS 座標，但查不到地名'; return; }
    resolvedPlaceName = label;
    gpsHint.textContent = '地點：' + label;
    const idx = locationCardIndex();
    if (idx === -1) return;
    if (!fieldTouched.has(idx + ':place')) {
      fieldState[idx] = fieldState[idx] || {};
      fieldState[idx].place = label;
      if (cardInputs[idx] && cardInputs[idx].place) cardInputs[idx].place.value = label;
      if (cardImgEls[idx]) refreshCardImage(idx);
    }
  }).catch(() => { gpsHint.textContent = '地點查詢失敗（可能沒有網路）'; });
}
function formatCoords(c) {
  if (!c) return '';
  const ns = c.lat >= 0 ? 'N' : 'S';
  const ew = c.lon >= 0 ? 'E' : 'W';
  return `${Math.abs(c.lat).toFixed(4)}°${ns}  ${Math.abs(c.lon).toFixed(4)}°${ew}`;
}
function formatDateTime(d) {
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  return `${time} · ${date}`;
}

/* ---------------- color extraction ---------------- */
function extractPalette(img, count) {
  const sampleCanvas = document.createElement('canvas');
  const size = 120;
  sampleCanvas.width = size;
  sampleCanvas.height = size;
  const sctx = sampleCanvas.getContext('2d');
  sctx.drawImage(img, 0, 0, size, size);
  const data = sctx.getImageData(0, 0, size, size).data;

  const buckets = new Map();
  const step = 24;
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 128) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const key = [Math.round(r / step), Math.round(g / step), Math.round(b / step)].join(',');
    if (!buckets.has(key)) buckets.set(key, { r: 0, g: 0, b: 0, n: 0 });
    const bucket = buckets.get(key);
    bucket.r += r; bucket.g += g; bucket.b += b; bucket.n += 1;
  }

  let entries = Array.from(buckets.values()).map(b => ({ r: b.r / b.n, g: b.g / b.n, b: b.b / b.n, n: b.n }));
  entries.sort((a, b) => b.n - a.n);

  const clusters = [];
  const dist = (a, c) => Math.hypot(a.r - c.r, a.g - c.g, a.b - c.b);
  for (const e of entries) {
    let merged = false;
    for (const c of clusters) {
      if (dist(e, c) < 40) {
        const total = c.n + e.n;
        c.r = (c.r * c.n + e.r * e.n) / total;
        c.g = (c.g * c.n + e.g * e.n) / total;
        c.b = (c.b * c.n + e.b * e.n) / total;
        c.n = total;
        merged = true;
        break;
      }
    }
    if (!merged) clusters.push({ ...e });
    if (clusters.length >= count * 3) break;
  }
  clusters.sort((a, b) => b.n - a.n);
  return clusters.slice(0, count).map(c => ({ r: Math.round(c.r), g: Math.round(c.g), b: Math.round(c.b) }));
}

function toHex(c) { const h = n => n.toString(16).padStart(2, '0'); return '#' + h(c.r) + h(c.g) + h(c.b); }
function luminance(c) { return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b; }
function textOn(c) { return luminance(c) > 150 ? '#241F1B' : '#F6F3EC'; }
function mixWhite(c, amt) { return { r: c.r + (255 - c.r) * amt, g: c.g + (255 - c.g) * amt, b: c.b + (255 - c.b) * amt }; }
function mixBlack(c, amt) { return { r: c.r * (1 - amt), g: c.g * (1 - amt), b: c.b * (1 - amt) }; }
function rgbStr(c) { return `rgb(${c.r | 0},${c.g | 0},${c.b | 0})`; }

function renderPalette(palette) {
  paletteSection.style.display = 'block';
  paletteRow.innerHTML = '';
  palette.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === selectedColorIndex ? ' active' : '');
    sw.style.background = rgbStr(c);
    sw.title = toHex(c);
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.style.color = textOn(c);
    sw.appendChild(check);
    const hexLabel = document.createElement('span');
    hexLabel.className = 'hex mono';
    hexLabel.textContent = toHex(c);
    sw.appendChild(hexLabel);
    sw.addEventListener('click', () => {
      selectedColorIndex = i;
      renderPalette(currentPalette);
      if (currentImage) refreshAllCardImages();
    });
    paletteRow.appendChild(sw);
  });
}
function getActivePalette() {
  if (!currentPalette.length) return currentPalette;
  const rest = currentPalette.filter((_, i) => i !== selectedColorIndex);
  return [currentPalette[selectedColorIndex], ...rest];
}

/* ---------------- image draw helper (cover fit with pan/zoom) ---------------- */
function drawCover(ctx, img, x, y, w, h) {
  const iw = img.width, ih = img.height;
  const baseScale = Math.max(w / iw, h / ih);
  const effScale = baseScale * cropZoom;
  let sw = Math.min(w / effScale, iw);
  let sh = Math.min(h / effScale, ih);
  let sx = cropCenterX - sw / 2;
  let sy = cropCenterY - sh / 2;
  sx = Math.max(0, Math.min(sx, iw - sw));
  sy = Math.max(0, Math.min(sy, ih - sh));
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBarcode(ctx, x, y, w, h, seed) {
  let bx = x, i = 0;
  while (bx < x + w) {
    const bw = 1.5 + ((seed.r + seed.g * i + seed.b) % 4);
    if (i % 5 !== 4) ctx.fillRect(bx, y, bw, h);
    bx += bw + 2;
    i++;
  }
}

/* ---------------- card templates (ctx,W,H,img,palette,fields) ---------------- */
function cardColorDate(ctx, W, H, img, p, f) {
  const bg = mixWhite(p[0], 0.55);
  const textColor = textOn(bg) === '#241F1B' ? mixBlack(bg, 0.7) : mixWhite(bg, 0.9);
  const topH = H * 0.4;
  ctx.fillStyle = rgbStr(bg);
  ctx.fillRect(0, 0, W, topH);

  ctx.textAlign = 'center';
  ctx.fillStyle = textOn(bg);
  ctx.font = `700 ${W * 0.062 * fontScale}px ${serifFont}`;
  ctx.fillText(f.title, W / 2, topH * 0.46);

  ctx.font = `${W * 0.034 * fontScale}px ${monoFont}`;
  ctx.fillStyle = textOn(bg) === '#241F1B' ? 'rgba(36,31,27,0.6)' : 'rgba(246,243,236,0.75)';
  ctx.fillText(f.time, W / 2, topH * 0.46 + W * 0.065);
  ctx.textAlign = 'left';

  drawCover(ctx, img, 0, topH, W, H - topH);
}

function cardMusicPlayer(ctx, W, H, img, p, f) {
  const bg = mixBlack(p[0], 0.78);
  ctx.fillStyle = rgbStr(bg);
  ctx.fillRect(0, 0, W, H);

  const pad = W * 0.08;
  const artSize = W - pad * 2;
  const artY = pad * 1.3;
  ctx.save();
  roundRect(ctx, pad, artY, artSize, artSize, W * 0.03);
  ctx.clip();
  drawCover(ctx, img, pad, artY, artSize, artSize);
  ctx.restore();

  const fg = '#F5F3EE';
  let ty = artY + artSize + H * 0.085;
  ctx.fillStyle = fg;
  ctx.font = `700 ${W * 0.058 * fontScale}px ${serifFont}`;
  ctx.fillText(f.title, pad, ty);
  const tw = ctx.measureText(f.title).width;
  ctx.fillStyle = 'rgba(245,243,238,0.55)';
  ctx.fillText('›', pad + tw + 10, ty);

  ty += H * 0.05;
  ctx.font = `${W * 0.036 * fontScale}px ${serifFont}`;
  ctx.fillStyle = 'rgba(245,243,238,0.55)';
  ctx.fillText(f.subtitle, pad, ty);

  const barY = ty + H * 0.075;
  const barW = W - pad * 2;
  ctx.fillStyle = 'rgba(245,243,238,0.25)';
  ctx.fillRect(pad, barY, barW, 3);
  const progress = 0.015 + (p[0].r % 15) / 150;
  ctx.fillStyle = fg;
  ctx.fillRect(pad, barY, barW * progress, 3);
  ctx.beginPath(); ctx.arc(pad + barW * progress, barY + 1.5, 4.5, 0, Math.PI * 2); ctx.fill();

  const totalSec = 150 + (p[0].g % 120);
  const elapsedSec = Math.round(progress * totalSec);
  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  ctx.font = `${W * 0.028 * fontScale}px ${monoFont}`;
  ctx.fillStyle = 'rgba(245,243,238,0.55)';
  ctx.textAlign = 'left';
  ctx.fillText(fmtTime(elapsedSec), pad, barY + H * 0.045);
  ctx.textAlign = 'right';
  ctx.fillText(fmtTime(totalSec), pad + barW, barY + H * 0.045);
  ctx.textAlign = 'left';

  const ctrlY = barY + H * 0.135;
  const cx = W / 2;
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(cx, ctrlY, W * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgbStr(bg);
  ctx.fillRect(cx - W * 0.028, ctrlY - W * 0.035, W * 0.02, W * 0.07);
  ctx.fillRect(cx + W * 0.008, ctrlY - W * 0.035, W * 0.02, W * 0.07);

  ctx.fillStyle = fg;
  const prevX = cx - W * 0.22;
  ctx.beginPath();
  ctx.moveTo(prevX + W * 0.03, ctrlY - W * 0.045);
  ctx.lineTo(prevX - W * 0.03, ctrlY);
  ctx.lineTo(prevX + W * 0.03, ctrlY + W * 0.045);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(prevX + W * 0.03, ctrlY - W * 0.045, W * 0.012, W * 0.09);

  const nextX = cx + W * 0.22;
  ctx.beginPath();
  ctx.moveTo(nextX - W * 0.03, ctrlY - W * 0.045);
  ctx.lineTo(nextX + W * 0.03, ctrlY);
  ctx.lineTo(nextX - W * 0.03, ctrlY + W * 0.045);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(nextX - W * 0.03 - W * 0.012, ctrlY - W * 0.045, W * 0.012, W * 0.09);
}

function cardLocationStub(ctx, W, H, img, p, f) {
  const bg = p[0];
  const cream = { r: 245, g: 240, b: 231 };
  const ink = { r: 36, g: 31, b: 27 };
  ctx.fillStyle = rgbStr(bg);
  ctx.fillRect(0, 0, W, H);

  const cardX = W * 0.055, cardY = W * 0.055;
  const cardW = W - cardX * 2, cardH = H - cardY * 2;
  const radius = W * 0.07;
  const photoH = cardH * 0.62;

  ctx.save();
  roundRect(ctx, cardX, cardY, cardW, cardH, radius);
  ctx.clip();
  ctx.fillStyle = rgbStr(cream);
  ctx.fillRect(cardX, cardY, cardW, cardH);
  drawCover(ctx, img, cardX, cardY, cardW, photoH);
  ctx.restore();

  const notchY = cardY + photoH;
  const notchR = W * 0.032;
  ctx.fillStyle = rgbStr(bg);
  ctx.beginPath(); ctx.arc(cardX, notchY, notchR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cardX + cardW, notchY, notchR, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = rgbStr(bg);
  ctx.lineWidth = 3;
  ctx.setLineDash([7, 6]);
  ctx.beginPath();
  ctx.moveTo(cardX + notchR, notchY);
  ctx.lineTo(cardX + cardW - notchR, notchY);
  ctx.stroke();
  ctx.setLineDash([]);

  const pad = cardX + cardW * 0.07;
  let ty = notchY + cardH * 0.13;

  ctx.fillStyle = rgbStr(ink);
  ctx.font = `700 ${W * 0.058 * fontScale}px ${serifFont}`;
  const place = (f.place && f.place.trim()) ? f.place.trim() : '在路上的某個角落';
  ctx.fillText(place, pad, ty);

  ty += cardH * 0.075;
  ctx.font = `${W * 0.032 * fontScale}px ${monoFont}`;
  ctx.fillStyle = rgbStr(mixWhite(ink, 0.25));
  ctx.fillText(formatDateTime(shotDate), pad, ty);

  if (gpsCoords) {
    ty += cardH * 0.16;
    ctx.font = `700 ${W * 0.032 * fontScale}px ${monoFont}`;
    ctx.fillStyle = rgbStr(ink);
    ctx.fillText(formatCoords(gpsCoords), pad, ty);
  }

  const barY = cardY + cardH - cardH * 0.09;
  ctx.fillStyle = rgbStr(ink);
  drawBarcode(ctx, pad, barY - 22, cardW * 0.6, 20, bg);
}

function cardPolaroid(ctx, W, H, img, p, f) {
  const c0 = p[0], c1 = p[1] || p[0];
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0, 0, W, H);
  const m = W * 0.06;
  const photoH = H * 0.68;
  drawCover(ctx, img, m, m, W - m * 2, photoH);
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(m, m, W - m * 2, photoH);
  ctx.fillStyle = rgbStr(c0);
  ctx.beginPath();
  ctx.arc(W - m - 14, m + photoH - 14, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#241F1B';
  ctx.font = `${W * 0.052 * fontScale}px ${monoFont}`;
  ctx.fillText(f.caption, m + 2, H - m * 1.6);
  ctx.fillStyle = rgbStr(c1);
  ctx.fillRect(m, H - m * 0.95, W - m * 2, 4);
}

function cardTicket(ctx, W, H, img, p, f) {
  const c0 = p[0], c1 = p[1] || p[0], c2 = p[2] || p[0];
  const bg = mixWhite(c0, 0.85);
  ctx.fillStyle = rgbStr(bg);
  ctx.fillRect(0, 0, W, H);

  const photoH = H * 0.42;
  drawCover(ctx, img, 0, 0, W, photoH);

  ctx.fillStyle = rgbStr(c0);
  ctx.fillRect(0, photoH, W, 6);

  const perfY = photoH + 6;
  ctx.fillStyle = rgbStr(bg);
  for (let x = -10; x < W + 10; x += 24) { ctx.beginPath(); ctx.arc(x, perfY, 7, 0, Math.PI * 2); ctx.fill(); }

  const pad = W * 0.08;
  ctx.fillStyle = '#241F1B';
  ctx.font = `700 ${W * 0.07 * fontScale}px ${serifFont}`;
  ctx.fillText('旅 行 票 根', pad, photoH + 46);

  ctx.font = `${W * 0.032 * fontScale}px ${monoFont}`;
  const rows = [['FROM', f.from], ['TO', f.to], ['DATE', f.date], ['SEAT', f.seat]];
  let ry = photoH + 78;
  rows.forEach(([k, v]) => {
    ctx.fillStyle = '#6B6459';
    ctx.fillText(k, pad, ry);
    ctx.fillStyle = '#241F1B';
    ctx.fillText(v, pad + W * 0.22, ry);
    ry += H * 0.065;
  });

  ctx.strokeStyle = rgbStr(c1);
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(pad, H - H * 0.12);
  ctx.lineTo(W - pad, H - H * 0.12);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = `${W * 0.03 * fontScale}px ${monoFont}`;
  ctx.fillStyle = rgbStr(c2);
  ctx.fillText('NO. ' + toHex(p[0]).slice(1).toUpperCase(), pad, H - H * 0.05);
}

function cardFilm(ctx, W, H, img, p, f) {
  ctx.fillStyle = '#161412';
  ctx.fillRect(0, 0, W, H);
  const holeR = W * 0.018;
  const holeGap = H * 0.09;
  for (let side = 0; side < 2; side++) {
    const hx = side === 0 ? W * 0.05 : W * 0.95;
    for (let y = holeGap / 2; y < H; y += holeGap) {
      ctx.fillStyle = '#0B0A09';
      roundRect(ctx, hx - holeR, y - holeR, holeR * 2, holeR * 2, 2);
      ctx.fill();
    }
  }
  const fx = W * 0.11, fw = W * 0.78;
  const frameH = (H - H * 0.06) / 3;
  for (let i = 0; i < 3; i++) {
    const fy = H * 0.03 + i * frameH;
    drawCover(ctx, img, fx, fy + 4, fw, frameH - 8);
    const tint = p[i % p.length];
    ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},0.22)`;
    ctx.fillRect(fx, fy + 4, fw, frameH - 8);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `${W * 0.026 * fontScale}px ${monoFont}`;
  ctx.save();
  ctx.translate(W * 0.5, H * 0.985);
  ctx.textAlign = 'center';
  ctx.fillText((f.caption || '').toUpperCase(), 0, 0);
  ctx.restore();
}

function cardCalendar(ctx, W, H, img, p, f) {
  const c0 = p[0], c1 = p[1] || p[0];
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0, 0, W, H);

  const headH = H * 0.3;
  drawCover(ctx, img, 0, 0, W, headH);
  ctx.fillStyle = `rgba(${c0.r},${c0.g},${c0.b},0.28)`;
  ctx.fillRect(0, 0, W, headH);

  const cd = shotDate;
  ctx.fillStyle = '#fff';
  ctx.font = `700 ${W * 0.09 * fontScale}px ${monoFont}`;
  ctx.fillText(String(cd.getDate()).padStart(2, '0'), W * 0.06, headH - 18);
  ctx.font = `${W * 0.035 * fontScale}px ${serifFont}`;
  ctx.fillText(['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'][cd.getMonth()], W * 0.06, headH - 46);

  const days = ['日','一','二','三','四','五','六'];
  const gridTop = headH + H * 0.08;
  const cell = (W - W * 0.12) / 7;
  ctx.font = `${W * 0.028 * fontScale}px ${monoFont}`;
  ctx.fillStyle = '#6B6459';
  days.forEach((d, i) => { ctx.textAlign = 'center'; ctx.fillText(d, W * 0.06 + cell * i + cell / 2, gridTop); });

  const firstDay = new Date(cd.getFullYear(), cd.getMonth(), 1).getDay();
  const daysInMonth = new Date(cd.getFullYear(), cd.getMonth() + 1, 0).getDate();
  let row = 0, col = firstDay;
  for (let d = 1; d <= daysInMonth; d++) {
    const cx = W * 0.06 + cell * col + cell / 2;
    const cy = gridTop + H * 0.075 * (row + 1);
    if (d === cd.getDate()) {
      ctx.fillStyle = rgbStr(c1);
      ctx.beginPath(); ctx.arc(cx, cy - 6, cell * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = textOn(c1);
    } else { ctx.fillStyle = '#241F1B'; }
    ctx.font = `${W * 0.026 * fontScale}px ${monoFont}`;
    ctx.textAlign = 'center';
    ctx.fillText(String(d), cx, cy - 1);
    col++;
    if (col > 6) { col = 0; row++; }
  }
  ctx.textAlign = 'left';
  if (f.note) {
    ctx.font = `${W * 0.026 * fontScale}px ${serifFont}`;
    ctx.fillStyle = '#6B6459';
    ctx.fillText(f.note, W * 0.06, H * 0.965);
  }
}

function cardPostcard(ctx, W, H, img, p, f) {
  const c0 = p[0], c1 = p[1] || p[0];
  ctx.fillStyle = '#F6F1E6';
  ctx.fillRect(0, 0, W, H);
  const half = W * 0.52;
  drawCover(ctx, img, 0, 0, half, H);

  ctx.strokeStyle = rgbStr(mixWhite(c0, 0.4));
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const ly = H * 0.28 + i * H * 0.13;
    ctx.beginPath(); ctx.moveTo(half + W * 0.06, ly); ctx.lineTo(W - W * 0.06, ly); ctx.stroke();
  }

  const stampW = W * 0.22, stampH = stampW * 1.2;
  const sx = W - W * 0.08 - stampW, sy = H * 0.06;
  ctx.fillStyle = rgbStr(mixWhite(c0, 0.75));
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = rgbStr(c0);
  ctx.lineWidth = 2;
  roundRect(ctx, sx, sy, stampW, stampH, 2);
  ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = rgbStr(c0);
  ctx.font = `${W * 0.03 * fontScale}px ${monoFont}`;
  ctx.textAlign = 'center';
  ctx.fillText(toHex(c0).toUpperCase(), sx + stampW / 2, sy + stampH / 2 + 4);
  ctx.textAlign = 'left';

  ctx.strokeStyle = rgbStr(c1);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx - stampW * 0.3, sy + stampH + 26, 20, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `${W * 0.018 * fontScale}px ${monoFont}`;
  ctx.fillStyle = rgbStr(c1);
  ctx.textAlign = 'center';
  ctx.fillText('TAIPEI', sx - stampW * 0.3, sy + stampH + 22);
  ctx.fillText(shotDate.toISOString().slice(0, 10), sx - stampW * 0.3, sy + stampH + 34);
  ctx.textAlign = 'left';

  ctx.font = `${W * 0.045 * fontScale}px ${serifFont}`;
  ctx.fillStyle = '#241F1B';
  ctx.fillText(f.message, half + W * 0.06, H * 0.2);
}

function cardBoardingPass(ctx, W, H, img, p, f) {
  const c0 = p[0], c1 = p[1] || p[0];
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0, 0, W, H);

  const stubW = W * 0.28;
  ctx.fillStyle = rgbStr(mixWhite(c0, 0.82));
  ctx.fillRect(W - stubW, 0, stubW, H);

  drawCover(ctx, img, 0, 0, W - stubW, H * 0.34);
  ctx.fillStyle = `rgba(${c0.r},${c0.g},${c0.b},0.25)`;
  ctx.fillRect(0, 0, W - stubW, H * 0.34);

  const pad = W * 0.05;
  ctx.fillStyle = '#241F1B';
  ctx.font = `700 ${W * 0.06 * fontScale}px ${serifFont}`;
  ctx.fillText('登 機 證', pad, H * 0.34 + 40);
  ctx.font = `${W * 0.03 * fontScale}px ${monoFont}`;
  ctx.fillStyle = rgbStr(c1);
  ctx.fillText('BOARDING PASS', pad, H * 0.34 + 62);

  const info = [['GATE', f.gate], ['SEAT', f.seat], ['TIME', f.time]];
  let iy = H * 0.34 + 100;
  info.forEach(([k, v]) => {
    ctx.font = `${W * 0.024 * fontScale}px ${monoFont}`;
    ctx.fillStyle = '#6B6459';
    ctx.fillText(k, pad, iy);
    ctx.font = `700 ${W * 0.038 * fontScale}px ${monoFont}`;
    ctx.fillStyle = '#241F1B';
    ctx.fillText(v, pad, iy + 26);
    iy += H * 0.13;
  });

  ctx.strokeStyle = rgbStr(mixWhite(c0, 0.3));
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(W - stubW, 0); ctx.lineTo(W - stubW, H); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  ctx.translate(W - stubW / 2, H * 0.5);
  ctx.rotate(Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.font = `${W * 0.032 * fontScale}px ${monoFont}`;
  ctx.fillStyle = rgbStr(c0);
  ctx.fillText(toHex(c0).toUpperCase() + '   ' + toHex(c1).toUpperCase(), 0, 0);
  ctx.restore();

  let bx = W - stubW + pad;
  const barTop = H * 0.72;
  for (let i = 0; i < 14; i++) {
    const bw = 2 + (p[0].r + i * 13) % 5;
    ctx.fillStyle = i % 3 === 0 ? rgbStr(c0) : '#241F1B';
    ctx.fillRect(bx, barTop, bw, H * 0.16);
    bx += bw + 3;
  }
}

/* ---------------- card definitions with editable fields ---------------- */
const CARD_DEFS = [
  { name: '色塊日期卡', w: 340, h: 460, draw: cardColorDate,
    fields: [
      { key: 'title', label: '標題文字', default: () => resolvedPlaceName || '此刻，某處' },
      { key: 'time', label: '時間', default: () => shotDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) }
    ] },
  { name: '音樂播放卡', w: 320, h: 560, draw: cardMusicPlayer,
    fields: [
      { key: 'title', label: '標題文字', default: () => resolvedPlaceName || 'Memories' },
      { key: 'subtitle', label: '副標文字', default: () => 'Memory Palette' }
    ] },
  { name: '旅拍地標卡', w: 340, h: 470, draw: cardLocationStub,
    fields: [{ key: 'place', label: '地點名稱', default: () => resolvedPlaceName || '在路上的某個角落' }] },
  { name: '拍立得', w: 320, h: 400, draw: cardPolaroid,
    fields: [{ key: 'caption', label: '日期／說明文字', default: () => shotDate.toISOString().slice(0, 10).replace(/-/g, '.') }] },
  { name: '旅行票根', w: 320, h: 480, draw: cardTicket,
    fields: [
      { key: 'from', label: '出發地', default: () => 'TPE' },
      { key: 'to', label: '目的地', default: () => '——' },
      { key: 'date', label: '日期', default: () => shotDate.toISOString().slice(0, 10) },
      { key: 'seat', label: '座位', default: (img, p) => String(12 + (p[0].r % 20)).padStart(2, '0') + 'A' }
    ] },
  { name: '底片', w: 320, h: 480, draw: cardFilm,
    fields: [{ key: 'caption', label: '底片標籤文字', default: (img, p) => p.map(c => toHex(c)).join('  ') }] },
  { name: '月曆', w: 320, h: 400, draw: cardCalendar,
    fields: [{ key: 'note', label: '備註文字（選填）', default: () => '' }] },

    ] }

/* ---------------- rendering ---------------- */
function resolveFieldsForRender(idx) {
  const defs = CARD_DEFS[idx].fields || [];
  const out = {};
  defs.forEach(d => {
    out[d.key] = (fieldState[idx] && fieldState[idx][d.key] !== undefined) ? fieldState[idx][d.key] : d.default(currentImage, getActivePalette());
  });
  return out;
}
function renderCardDataUrl(idx) {
  const def = CARD_DEFS[idx];
  const canvas = document.createElement('canvas');
  const scale = 2;
  canvas.width = def.w * scale;
  canvas.height = def.h * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  const f = resolveFieldsForRender(idx);
  def.draw(ctx, def.w, def.h, currentImage, getActivePalette(), f);
  return canvas.toDataURL('image/png');
}
function refreshCardImage(idx) {
  const dataUrl = renderCardDataUrl(idx);
  if (cardImgEls[idx]) cardImgEls[idx].src = dataUrl;
  if (cardLinkEls[idx]) cardLinkEls[idx].href = dataUrl;
}
function refreshAllCardImages() {
  CARD_DEFS.forEach((_, idx) => refreshCardImage(idx));
}

function buildCardSlot(idx) {
  const def = CARD_DEFS[idx];
  const slot = document.createElement('div');
  slot.className = 'card-slot';

  const resultImg = document.createElement('img');
  resultImg.alt = def.name;
  resultImg.src = renderCardDataUrl(idx);
  cardImgEls[idx] = resultImg;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  const name = document.createElement('span');
  name.className = 'card-name';
  name.textContent = def.name;
  const index = document.createElement('span');
  index.className = 'card-index mono';
  index.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(CARD_DEFS.length).padStart(2, '0');
  meta.appendChild(name); meta.appendChild(index);

  const fieldsWrap = document.createElement('div');
  fieldsWrap.className = 'card-fields';
  const inputsMap = {};
  const resolved = resolveFieldsForRender(idx);
  (def.fields || []).forEach(fd => {
    const row = document.createElement('div');
    row.className = 'field-row';
    const label = document.createElement('label');
    label.className = 'field-label';
    label.textContent = fd.label;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'field-input';
    inp.value = resolved[fd.key];
    row.appendChild(label); row.appendChild(inp);
    fieldsWrap.appendChild(row);
    inputsMap[fd.key] = inp;
  });
  cardInputs[idx] = inputsMap;

  const updateBtn = document.createElement('button');
  updateBtn.type = 'button';
  updateBtn.className = 'update-btn';
  updateBtn.textContent = '更新這張卡片';
  updateBtn.addEventListener('click', () => {
    fieldState[idx] = fieldState[idx] || {};
    (def.fields || []).forEach(fd => {
      fieldState[idx][fd.key] = inputsMap[fd.key].value;
      fieldTouched.add(idx + ':' + fd.key);
    });
    refreshCardImage(idx);
  });

  const link = document.createElement('a');
  link.className = 'download-btn';
  link.textContent = 'download';
  link.href = resultImg.src;
  link.download = def.name + '.png';
  cardLinkEls[idx] = link;

  const hint = document.createElement('p');
  hint.className = 'field-hint';
  hint.textContent = '手機點下載會嘗試直接存到相簿';

  link.addEventListener('click', e => {
    const currentDataUrl = link.href;
    if (navigator.share && navigator.canShare) {
      try {
        const blob = dataURLtoBlob(currentDataUrl);
        const file = new File([blob], def.name + '.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          e.preventDefault();
          hint.textContent = '開啟分享面板…選「儲存影像」存到相簿';
          navigator.share({ files: [file], title: def.name + '.png' })
            .catch(() => { hint.textContent = '已取消或分享失敗，可改用長按圖片存檔'; });
          return;
        }
      } catch (err) { /* fall through to native <a download> */ }
    }
    hint.textContent = '下載中…';
  });

  const btnRow = document.createElement('div');
  btnRow.style.display = 'flex';
  btnRow.style.gap = '8px';
  btnRow.style.flexWrap = 'wrap';
  btnRow.appendChild(updateBtn);
  btnRow.appendChild(link);

  slot.appendChild(resultImg);
  slot.appendChild(meta);
  slot.appendChild(fieldsWrap);
  slot.appendChild(btnRow);
  slot.appendChild(hint);
  grid.appendChild(slot);
}

function dataURLtoBlob(dataUrl) {
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

function renderAllCards() {
  galleryEmpty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';
  for (const k in cardImgEls) delete cardImgEls[k];
  for (const k in cardLinkEls) delete cardLinkEls[k];
  for (const k in cardInputs) delete cardInputs[k];
  CARD_DEFS.forEach((_, idx) => buildCardSlot(idx));
}
</script>
</body>
</html>
